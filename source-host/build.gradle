// Desktop/JNI JVM source host. The embedding platform supplies its pinned Mihon/AndroidCompat runtime.
plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'application'
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	implementation project(':core-source')
	implementation project(':dex-convert')
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
	// Browser cookie import is reflective over the source's own OkHttp; tests drive a real client.
	testImplementation libs.okhttp
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

application {
	mainClass = 'org.skepsun.kototoro.source.host.SourceHostCliKt'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

// The iOS JNI smoke harness reuses the independent Java fixture, not third-party API binaries.
tasks.register('exportEmbeddedFixture', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.skepsun.kototoro.source.host.EmbeddedFixtureExporterKt'
	args layout.buildDirectory.dir('embedded-fixture').get().asFile.absolutePath
}
